        fecha_prometida: "2020"
        fuente_tipo: musk
        fuente: "Musk, Autonomy Day (CNBC)"
        enlace: "https://www.cnbc.com/2019/04/22/elon-musk-says-tesla-robotaxis-will-hit-the-market-next-year.html"
        cita: "next year for sure, we'll have over a million robotaxis on the road"
      - declarada: "2025-07-23"
        fecha_prometida: "2025"
        fuente_tipo: musk
        fuente: "Musk, llamada de resultados Q2 2025 (transcripción Motley Fool)"
        enlace: "https://www.fool.com/earnings/call-transcripts/2025/07/23/tesla-tsla-q2-2025-earnings-call-transcript/"
        cita: "autonomous ride-hailing in probably half the population of the US"
