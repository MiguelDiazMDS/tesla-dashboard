        fecha_prometida: "2025"
        fuente_tipo: musk
        fuente: "Musk, llamada de resultados Q3 2025 (transcripción Motley Fool)"
        enlace: "https://www.fool.com/earnings/call-transcripts/2025/10/22/tesla-tsla-q3-2025-earnings-call-transcript/"
