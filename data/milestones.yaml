  - id: automovil
    prioridad: 4
    titulo: "Recuperación del beneficio del automóvil"
    que_debe_ocurrir: "Sostener entregas y mejorar precios, costes y margen operativo durante varios trimestres."
    que_demostraria: "Es el hito menos espectacular, pero afecta al negocio que hoy financia las inversiones. En el segundo trimestre Tesla entregó 480.126 vehículos y declaró 398 millones de dólares de beneficio operativo sobre 28.240 millones de ingresos. Más volumen solo crearía valor de forma duradera si se traduce en más beneficio y caja."
    pasos: []
    requeridos: []
    estancado: null

  - id: energia
    prioridad: 5
    titulo: "Energía a mayor escala"
    que_debe_ocurrir: "Poner en marcha la nueva fábrica de Texas y aumentar entregas rentables de Megapack 3 y Megablock."
    que_demostraria: "Es un negocio existente con una ampliación concreta pendiente. Tesla indicó que esperaba iniciar allí producción en 2026; ya desplegó 22,3 GWh de almacenamiento en el primer semestre. Hay que vigilar el margen además de los GWh, porque los proyectos pueden desplazar ingresos entre trimestres."
    pasos:
      - id: inicio-produccion-megafactory-texas
        texto: "Inicio de producción en la Megafactory de Texas (Megapack 3 / Megablock)"
        etiqueta: R
        cumplido:
          fecha: "2026-08-06"
          fuente_tipo: oficial
          fuente: "Cuenta Tesla Megapack en X: Megapack 3 sale de la línea en Brookshire, Texas"
          enlace: "https://x.com/Tesla_Megapack/status/2085163367506059461"
    requeridos: [inicio-produccion-megafactory-texas]
