        fuente_tipo: oficial
        fuente: "Tesla Q4 2025 Update: Dallas, Houston, Phoenix, Miami, Orlando, Tampa y Las Vegas en 1H 2026"
        enlace: "https://www.sec.gov/Archives/edgar/data/1318605/000162828026003837/exhibit991.htm"
