# Borrador tanda 2 = tanda 1 revisada por el usuario + historial de promesas (capa 2).
# Investigacion a 2026-09-23. Ver informe_tanda1.md e informe_tanda2.md.
# Criterio de fuente_tipo: cartas, 10-Q/10-K, cuentas oficiales de Tesla y directivos
# distintos de Musk -> oficial; declaraciones de Musk (llamadas, eventos, X) -> musk;
# reguladores -> registro; prensa -> tercero.
version: "2026-09-24"

hitos:
  - id: robotaxi-escala
    prioridad: 1
    titulo: "Robotaxi a escala"
    que_debe_ocurrir: "Ampliar flota, zonas y viajes sin supervisor, y publicar datos útiles sobre utilización, incidentes, intervención remota e ingresos y costes por vehículo."
    que_demostraria: "Es la prueba decisiva de la tesis de Tesla como negocio de movilidad autónoma. Hoy la propia empresa describe la operación sin supervisión como un despliegue en expansión; en el área de San Francisco aún indica conductor de seguridad."
    pasos:
      - id: sin-supervisor-todas-zonas
        texto: "Operación sin supervisor en todas sus zonas operativas"
        etiqueta: R
        cumplido: null   # Q2 2026 Update: SF Bay Area sigue con "Safety Driver"
      - id: sin-supervisor-5-metros
        texto: "Operación sin supervisor en al menos 5 áreas metropolitanas"
        etiqueta: R
        cumplido:
          fecha: "2026-07-22"
          fuente_tipo: oficial
          fuente: "Tesla Q2 2026 Update: Austin, Dallas, Houston, Miami, Orlando y Tampa en «Ramping Unsupervised»"
          enlace: "https://www.sec.gov/Archives/edgar/data/1318605/000162828026049213/exhibit991.htm"
      - id: publica-utilizacion-incidentes
        texto: "Tesla publica utilización, incidentes e intervención remota"
        etiqueta: R
        cumplido: null
      - id: publica-economia-vehiculo
        texto: "Tesla publica ingresos y costes por vehículo, o un segmento propio"
        etiqueta: R
        cumplido: null
      - id: flota-1000-sin-supervisor
        texto: "Flota sin supervisor de al menos 1.000 vehículos"
        etiqueta: E
        requiere_valor: true
        # Sin cifra oficial. Ultimo dato de terceros: casi 200 vehiculos sin supervisor
        # (Robotaxi Tracker, via Teslarati 2026-08-31). Umbral no alcanzado.
        cumplido: null
    requeridos: [sin-supervisor-todas-zonas, sin-supervisor-5-metros, publica-utilizacion-incidentes, publica-economia-vehiculo, flota-1000-sin-supervisor]
    promesas:
